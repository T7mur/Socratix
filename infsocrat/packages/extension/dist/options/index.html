<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>InfSocrat — Settings</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        max-width: 480px;
        margin: 2em auto;
        padding: 0 1em;
      }
      label {
        display: block;
        margin-top: 1em;
        font-size: 13px;
        font-weight: 600;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        font: inherit;
        margin-top: 4px;
      }
      button {
        margin-top: 1.2em;
        padding: 8px 14px;
        font: inherit;
        cursor: pointer;
      }
      #status {
        margin-top: 10px;
        font-size: 13px;
      }
      p.note {
        font-size: 12px;
        color: #666;
      }
    </style>
    <script type="module" crossorigin src="/assets/options-B289r6Cc.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/storageKeys-C6wim-yj.js">
  </head>
  <body>
    <h2>InfSocrat — ELM connection</h2>
    <p class="note">Your API key is stored only in this browser profile (<code>chrome.storage.local</code>) and is sent only to the base URL below.</p>

    <label for="base-url">Base URL</label>
    <input id="base-url" type="text" placeholder="https://elm.ed.ac.uk/v1" />

    <label for="model">Model</label>
    <input id="model" type="text" placeholder="gpt-4o-mini" />

    <label for="api-key">API key</label>
    <input id="api-key" type="password" />

    <div>
      <button id="save-button">Save</button>
      <button id="test-button">Test connection</button>
    </div>
    <div id="status"></div>

  </body>
</html>
